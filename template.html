<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="Hernando Castano — technology consultant &amp; advisor. Distributed systems, applied cryptography, product, and business strategy.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B1</text></svg>">
  <style>
    :root {
      /* Black & silver + one gold accent */
      --bg:        #0a0b0d;   /* near-black */
      --fg:        #ccd2da;   /* silver body text — brightened for readability */
      --fg-bright: #f4f6f9;   /* bright silver / white */
      --emph:      #e6eaf0;   /* prose emphasis */
      --muted:     #9aa1ab;   /* mid gray — brightened */
      --faint:     #4d535d;   /* dividers, markers, brackets */
      --accent:    #e6b872;   /* warm gold — the one accent */
      --link:      #e6b872;   /* links share the accent */
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1100px 520px at 22% -8%, #1b1e24 0%, rgba(27, 30, 36, 0) 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco,
                   "Cascadia Code", "Roboto Mono", Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: #d6dbe2; color: var(--bg); }

    main {
      max-width: 46rem;
      margin: 0 auto;
      padding: clamp(1.5rem, 3.5vw, 2rem) 1.5rem 1.75rem;
    }

    /* Header — brushed-metal name */
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--fg-bright); /* fallback */
      background: linear-gradient(175deg, #ffffff 0%, #d3d8de 42%, #9aa0a8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin: 0.3rem 0 0;
      color: var(--muted);
    }
    .subtitle .lead { color: var(--fg-bright); }
    .subtitle .loc { color: var(--faint); }

    /* Plain-text divider rules — metallic fade to the right */
    .rule {
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
      letter-spacing: 0.05em;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .rule.eq {
      margin: 0.3rem 0 0.9rem;
      background: linear-gradient(90deg, #e9edf2 0%, #7d828b 55%, rgba(125, 130, 139, 0) 100%);
    }
    .rule.dash {
      margin: 0.85rem 0;
      background: linear-gradient(90deg, #565b64 0%, #40454e 45%, rgba(64, 69, 78, 0) 100%);
    }

    /* Section labels — a nod to the markdown look */
    section h2 {
      margin: 0 0 0.55rem;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: lowercase;
    }
    section h2::before {
      content: "# ";
      color: var(--faint);
    }

    p { margin: 0 0 0.6rem; max-width: 43rem; }
    p:last-child { margin-bottom: 0; }

    /* Experience list */
    ul.exp {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    ul.exp li {
      position: relative;
      padding-left: 1.4rem;
      margin-bottom: 0.4rem;
      max-width: 43rem;
    }
    ul.exp li::before {
      content: "*";
      position: absolute;
      left: 0;
      color: var(--faint);
    }
    ul.exp li:last-child { margin-bottom: 0; }
    .when { color: var(--muted); font-style: italic; }

    /* Companies stand out in bright silver; the accent lands on Biene Club */
    ul.exp .co { color: var(--fg-bright); font-weight: 700; letter-spacing: 0.02em; }
    ul.exp .co.a-yellow { color: var(--accent); }

    /* Links here take the colour of the text around them — the dotted gold
       underline on hover is what marks them as links. Without this the
       unbolded past employers would outshine the current ones. */
    ul.exp a { color: inherit; }

    /* Contact / links */
    ul.links {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    ul.links li { margin-bottom: 0.35rem; }
    ul.links li:last-child { margin-bottom: 0; }
    .lbl {
      display: inline-block;
      width: 5rem;
      color: var(--faint);
    }
    .lbl::before { content: "["; }
    .lbl::after  { content: "]"; }

    /* Footer art — inherits the page's monospace stack so the columns line up */
    pre.art {
      margin: 1.6rem 0 0;
      font: inherit;
      line-height: 1.15;
      color: var(--faint);
      overflow-x: auto;
    }

    a {
      color: var(--link);
      text-decoration: underline dotted transparent;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 0.25em;
      transition: text-decoration-color 0.15s ease;
    }
    /* Hover / keyboard focus — dotted gold, regardless of the text's own colour
       (company names are silver, so currentColor would not do) */
    a:hover, a:focus-visible { text-decoration-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 1px; }

    /* Emphasis (monochrome) — a hair brighter than body text. Prose bold is
       styled by element, so **it** looks the same whether or not the phrase
       happens to have an accent class. */
    section p strong,
    .a-blue, .a-teal, .a-green, .a-orange, .a-purple, .a-red { color: var(--emph); }
    /* Biene Club — the gold anchor that carries through the page */
    .a-yellow { color: var(--accent); text-shadow: 0 0 16px rgba(230, 184, 114, 0.40); }
  </style>
</head>
<body>
  <main>
{{content}}
  </main>
</body>
</html>
